services:
    frontend:
        build:
            context: services/php
            target: frontend
            cache_from:
                - "type=registry,ref=${REGISTRY:-}/frontend:cache"
        user: "${USER_ID}:${USER_ID}"
        volumes:
            - "../..:/var/www:cached"
            - "../../.home:/home/app:cached"
        profiles:
            - default
        labels:
            - "traefik.enable=true"
            - "project-name=${PROJECT_NAME}"
            - "traefik.http.routers.${PROJECT_NAME}-frontend.rule=Host(${PROJECT_DOMAINS})"
            - "traefik.http.routers.${PROJECT_NAME}-frontend.tls=true"
            - "traefik.http.routers.${PROJECT_NAME}-frontend-unsecure.rule=Host(${PROJECT_DOMAINS})"
            # Comment the next line to be able to access frontend via HTTP instead of HTTPS
            - "traefik.http.routers.${PROJECT_NAME}-frontend-unsecure.middlewares=redirect-to-https@file"

    builder:
        build:
            context: services/php
            target: builder
            cache_from:
                - "type=registry,ref=${REGISTRY:-}/builder:cache"
        init: true
        user: "${USER_ID}:${USER_ID}"
        environment:
            # How the CI builds the crates (.github/workflows/): unset, cargo
            # keeps its defaults
            - CARGO_INCREMENTAL
            - CARGO_PROFILE_DEV_DEBUG
            # static-php-cli asks the GitHub API for its downloads (castor
            # static-php:build): a token raises its rate limit
            - GITHUB_TOKEN
            # Where the website is published (castor website:build)
            - NATIVELLA_SITE_URL
            # The following list contains the common environment variables exposed by CI platforms
            - BUILD_NUMBER # Jenkins, TeamCity
            - CI # Travis CI, CircleCI, Cirrus CI, Gitlab CI, Appveyor, CodeShip, dsari
            - CONTINUOUS_INTEGRATION # Travis CI, Cirrus CI
            - GITHUB_ACTIONS
            - RUN_ID # TaskCluster, dsari
        volumes:
            - "../..:/var/www:cached"
            - "../../.home:/home/app:cached"
        profiles:
            - builder

    # The builder, with the Android SDK: castor mobile:android. In a profile of
    # its own, as it weighs several gigabytes: `castor docker:build` leaves it
    # out, the Android build builds it.
    android:
        build:
            context: services/php
            target: android
            cache_from:
                - "type=registry,ref=${REGISTRY:-}/android:cache"
        # The SDK and the NDK exist for Linux x86_64 only
        platform: linux/amd64
        init: true
        user: "${USER_ID}:${USER_ID}"
        environment:
            # How the CI builds the crates, as in the builder
            - CARGO_INCREMENTAL
            - CARGO_PROFILE_DEV_DEBUG
            - CI
            - GITHUB_ACTIONS
        volumes:
            - "../..:/var/www:cached"
            - "../../.home:/home/app:cached"
        profiles:
            - android

    # Builds what Nativella distributes for Linux, on Ubuntu 22.04 for its old
    # glibc: castor static-php:build, nativella:build, and --static on the
    # other tasks that build the crates. In a profile of its own, like android:
    # those tasks build it.
    static:
        build:
            context: services/php
            target: static
            cache_from:
                - "type=registry,ref=${REGISTRY:-}/static:cache"
        init: true
        user: "${USER_ID}:${USER_ID}"
        environment:
            # How the CI builds the crates, as in the builder
            - CARGO_INCREMENTAL
            - CARGO_PROFILE_DEV_DEBUG
            # static-php-cli asks the GitHub API for its downloads: a token
            # raises its rate limit
            - GITHUB_TOKEN
            - CI
            - GITHUB_ACTIONS
        volumes:
            - "../..:/var/www:cached"
            - "../../.home:/home/app:cached"
        profiles:
            - static
