global:
  checkNewVersion: false
  sendAnonymousUsage: false

providers:
  docker:
    exposedByDefault: false
    constraints: "Label(`project-name`,`{{ PROJECT_NAME }}`)"
  file:
    filename: /etc/traefik/dynamic_conf.yaml

# # Uncomment get all DEBUG logs
#log:
#    level: "DEBUG"

# # Uncomment to view all access logs
#accessLog: {}

# The dashboard and the API, on the traefik entry point, through the api
# router of dynamic_conf.yaml: castor about reads the routers there
api:
  dashboard: true

entryPoints:
  http:
    address: ":80"
  https:
    address: ":443"
  traefik: # this one exists by default
    address: ":8080"
