# The root domain and www.<root domain>: the website, built by
# `castor website:build` into website/dist/. Static files only.
server {
    listen 8080 default_server;
    server_name www.*;
    root /var/www/website/dist;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}

# <demo>.<root domain>: demos/<demo>/public, through its front controller. The
# name of the demo comes from the host, so that a new demo needs no change
# here; the regex only allows a directory name. Three labels at least: the
# root domain itself is the website's.
server {
    listen 8080;
    server_name "~^(?<demo>[a-z0-9-]+)\.[^.]+\.[^.]+$";
    root /var/www/demos/$demo/public;

    client_max_body_size 20m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        # try to serve file directly, fallback to index.php
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/var/run/php/php-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        # TLS is terminated upstream, by the router
        fastcgi_param HTTPS on;
        fastcgi_param SERVER_NAME $http_host;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }
}
