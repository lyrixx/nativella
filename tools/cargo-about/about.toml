# cargo-about gathers the licenses of the Rust crates for the third-party
# notices (.castor/notices.php), which downloads it into bin/.
#
# The licenses the crates may have, in the order cargo-about picks one of a
# crate that offers several: a crate under none of them fails the build.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

# What build scripts and tests use, which the executables do not contain
ignore-build-dependencies = true
ignore-dev-dependencies = true
