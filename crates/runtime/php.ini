; The php.ini of Nativella, compiled into the runtime (src/sapi.rs).
;
; With the static PHP, of the releases and of the phones, it is the only one:
; PHP reads no php.ini of the machine, nor PHPRC or PHP_INI_SCAN_DIR. With the
; PHP of the system, in development, it applies over the php.ini of that PHP,
; which loads its extensions.
;
; What depends on the machine, Nativella sets over it at startup, with
; PhpApp::with_ini(): the time zone, the directory of the sessions. An
; application changes the rest with ini_set(), but for the settings PHP reads
; before the script runs, like the two limits of uploads.

; Errors go to the standard error output (the terminal of `nativella run`,
; logcat on Android), not into the page: PHP answers a fatal error with a 500
; only when it does not display it.
display_errors = Off
log_errors = On

; Assertions are not even compiled, as in production.
zend.assertions = -1

; The application is local: a photo of a phone or a video goes beyond the
; 2 MB of PHP. The webview hands the runtime a body whole, in memory, before
; PHP reads it: these limits save no memory.
post_max_size = 512M
upload_max_filesize = 512M

; PHP built without threads times a request with ITIMER_PROF: the CPU time of
; the whole process, the GTK thread included, which runs while a dialog waits
; for the user. Past max_execution_time, the hard timeout kills the process
; (exit 124), the application with it: only the error of max_execution_time
; remains, which PHP raises once the dialog is answered, and which
; bridge::restart_time_limit() prevents.
hard_timeout = 0
