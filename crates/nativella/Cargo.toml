[package]
name = "nativella"
description = "Runs a PHP application as a desktop or mobile application, without a web server."
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

# Mobile platforms load the library: Android a cdylib, iOS a staticlib. The
# suffix keeps it apart from the binary (their debug files collide on Windows).
[lib]
name = "nativella_lib"
crate-type = ["cdylib", "rlib", "staticlib"]

[dependencies]
base64 = "0.23"
flate2 = "1"
getrandom = "0.4"
iana-time-zone = "0.1"
nativella-runtime = { path = "../runtime" }
percent-encoding = "2"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
tar = "0.4"
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# What `nativella android` draws the launcher icon with (src/apk/icon.rs):
# image, Tauri's, with the same features; and signs APKs with
# (src/apk/signing.rs): p256, sha2. What `nativella ios` reads and signs apps
# with (src/ios/): cms, der, plist, rsa, sha1, x509-cert, and the sha2 that
# rsa brings, of the same generation of RustCrypto as they are; and the
# PKCS #12 files of certificates, as Keychain Access and OpenSSL encrypt
# them: cbc, des, hmac, pkcs12, pkcs5, rc2.
cbc = "0.1"
cms = { version = "0.2", features = ["builder"] }
der = { version = "0.7", features = ["oid"] }
des = "0.8"
hmac = "0.12"
image = { version = "0.25", default-features = false, features = ["png"] }
notify = "8"
p256 = "0.14"
pkcs12 = { version = "0.1", features = ["kdf"] }
pkcs5 = { version = "0.7", features = ["alloc", "pbes2", "sha1-insecure"] }
plist = "1"
rc2 = "0.8"
rsa = { version = "0.9", features = ["sha2"] }
sha1 = "0.10"
sha2 = "0.11"
starship-battery = "0.12"
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-window-state = "2"
trash = "5"
x509-cert = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(all(unix, not(any(target_os = "android", target_os = "ios"))))'.dependencies]
signal-hook = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["crypto-rust", "sync-secret-service"] }
# What tauri-plugin-notification uses, for the clicks it does not report.
notify-rust = "4"
zbus = "5"
# What wry uses, to print to PDF.
gtk = "0.18"
webkit2gtk = "2.0"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[features]
# The APIs of phones: each one brings its plugin and the permissions it
# declares to the Android manifest. An application asks for them with the
# "permissions" of its composer.json: the template APK of `nativella android`
# has them all, and the application only registers the plugins it asks for;
# iOS builds turn them into features.
barcode-scanner = ["dep:tauri-plugin-barcode-scanner"]
biometrics = ["dep:tauri-plugin-biometric"]
geolocation = ["dep:tauri-plugin-geolocation"]
haptics = ["dep:tauri-plugin-haptics"]

[build-dependencies]
# What build.rs compresses the third-party notices with.
flate2 = "1"
tauri-build = { version = "2", features = [] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = { version = "2", optional = true }
tauri-plugin-biometric = { version = "2", optional = true }
tauri-plugin-fs = "2"
tauri-plugin-geolocation = { version = "2", optional = true }
tauri-plugin-haptics = { version = "2", optional = true }

# What tao already uses, to read the assets of the APK: the bundle of the
# application is one (see src/embedded.rs). jni in the version of tao's, which
# .github/dependabot.yml holds back.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk = { version = "0.9", default-features = false }
ndk-context = "0.1"
ndk-sys = "0.6"
