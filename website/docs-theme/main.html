{#-
  The Open Graph tags of the documentation, with the image of the landing page,
  under which it is published. Keep in sync with templates/layout.html.twig.
-#}
{% extends "base.html" %}

{% block extrahead %}
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ config.site_name }}">
  <meta property="og:title" content="{% if page.title and not page.is_homepage %}{{ page.title | striptags }} - {% endif %}{{ config.site_name }}">
  <meta property="og:description" content="{{ config.site_description }}">
  {% if page.canonical_url %}
    <meta property="og:url" content="{{ page.canonical_url }}">
  {% endif %}
  <meta property="og:image" content="{{ config.site_url | replace('/docs/', '/assets/og.png') }}">
  <meta property="og:image:width" content="1280">
  <meta property="og:image:height" content="640">
  <meta property="og:image:alt" content="Nativella: your PHP app, in a window of its own.">
  <meta name="twitter:card" content="summary_large_image">
{% endblock %}
