<!doctype html>
<!--
    The source of assets/og.png, the Open Graph image (1200 × 630). See README.md
    to regenerate it.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nativella</title>
<style>
    @font-face {
        font-family: "Fraunces";
        font-weight: 400 800;
        src: url("../assets/fonts/fraunces.woff2") format("woff2");
    }

    html, body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
    }

    body {
        position: relative;
        box-sizing: border-box;
        padding: 64px 72px;
        background:
            radial-gradient(700px 420px at 100% 0%, rgb(196 70 31 / 16%), transparent 70%),
            radial-gradient(600px 360px at 0% 100%, rgb(30 107 102 / 14%), transparent 70%),
            #f6f0e5;
        color: #1d1a16;
        font-family: ui-sans-serif, system-ui, "Segoe UI", Ubuntu, sans-serif;
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 16px;
        font: 640 40px/1 "Fraunces", Georgia, serif;
        letter-spacing: -.02em;
    }

    .tag {
        margin-left: 8px;
        padding: 6px 14px;
        border: 1.5px solid #c8bba5;
        border-radius: 999px;
        color: #685f52;
        font: 500 18px/1.2 ui-monospace, "DejaVu Sans Mono", monospace;
        letter-spacing: 0;
    }

    h1 {
        margin: 60px 0 0;
        max-width: 900px;
        font: 640 92px/.98 "Fraunces", Georgia, serif;
        letter-spacing: -.035em;
    }

    .line {
        position: absolute;
        left: 72px;
        right: 72px;
        bottom: 60px;
        display: flex;
        gap: 28px;
        padding-top: 22px;
        border-top: 2px solid #1d1a16;
        color: #4a443b;
        font: 500 22px/1.3 ui-monospace, "DejaVu Sans Mono", monospace;
    }

    .line s {
        text-decoration-color: #c4461f;
        text-decoration-thickness: 3px;
    }

    .line b {
        margin-left: auto;
        color: #b8411f;
    }
</style>
</head>
<body>
    <div class="brand">
        <svg viewBox="0 0 64 64" width="56" height="56">
            <rect width="64" height="64" rx="16" fill="#c4461f"/>
            <rect x="12" y="12" width="40" height="5" rx="2.5" fill="#fff8ee" opacity=".55"/>
            <path d="M20 50V36a12 12 0 0 1 24 0v14" fill="none" stroke="#fff8ee" stroke-width="8" stroke-linecap="round"/>
        </svg>
        nativella
        <span class="tag">open source · experimental</span>
    </div>
    <h1>Your PHP app, in a window of its own.</h1>
    <div class="line">
        <s>nginx</s><s>PHP-FPM</s><s>a port</s><s>Electron</s>
        <b>Symfony · Laravel · plain PHP</b>
    </div>
</body>
</html>
