# The documentation: docs/*.md, built by Zensical into dist/docs/, under the
# landing page (castor website:build). See README.md.
#
# In the format of mkdocs.yml, which Zensical reads too: unlike zensical.toml,
# it takes environment variables (!ENV).
#
# bin/build stages the documents in var/docs/ first: links to the rest of the
# repository lead to GitHub there, and .nav.yml holds the navigation, which
# it reads from docs/README.md (src/Documentation.php).

site_name: Nativella
site_description: Run a PHP web application as a desktop application, with PHP embedded and no web server.
# castor website:build sets it from NATIVELLA_SITE_URL
site_url: !ENV [NATIVELLA_DOCS_URL, "https://lyrixx.github.io/nativella/docs/"]
repo_url: https://github.com/lyrixx/nativella
repo_name: lyrixx/nativella
edit_uri: edit/main/docs/
copyright: Nativella is open source, under the MIT license.

docs_dir: var/docs
site_dir: dist/docs

# A link to a page or a section that does not exist fails the build; so does
# a document left out of docs/README.md, in bin/build
strict: true

theme:
    name: material
    # The look of Material for MkDocs, which docs-theme/ restyles
    variant: classic
    custom_dir: docs-theme
    # The site loads nothing from another domain: no Google Fonts
    font: false
    language: en
    # Relative to the documentation, which is published under the landing page
    favicon: ../assets/favicon.svg
    logo: ../assets/favicon.svg
    features:
        - content.action.edit
        - content.code.copy
        - navigation.footer
        - navigation.sections
        - navigation.top
        - search.highlight
        - search.suggest
        - toc.follow
    palette:
        - media: "(prefers-color-scheme)"
          toggle:
              icon: material/brightness-auto
              name: Light mode
        - media: "(prefers-color-scheme: light)"
          scheme: default
          primary: custom
          accent: custom
          toggle:
              icon: material/brightness-7
              name: Dark mode
        - media: "(prefers-color-scheme: dark)"
          scheme: slate
          primary: custom
          accent: custom
          toggle:
              icon: material/brightness-4
              name: System preference

extra:
    # The logo leads to the landing page
    homepage: ../
    generator: false

extra_css:
    - stylesheets/nativella.css

markdown_extensions:
    - admonition
    - attr_list
    - md_in_html
    - pymdownx.details
    - pymdownx.highlight:
          # Most PHP samples have no "<?php", which Pygments waits for
          extend_pygments_lang:
              - name: php
                lang: php
                options:
                    startinline: true
          pygments_lang_class: true
    - pymdownx.inlinehilite
    - pymdownx.magiclink
    # GitHub alerts: > [!NOTE]
    - pymdownx.quotes:
          callouts: true
    - pymdownx.superfences
    - tables
    - toc:
          permalink: true
          # The anchors of GitHub, which the documents link to
          slugify:
              object: pymdownx.slugs.slugify
              kwds:
                  case: lower

plugins:
    # The navigation, in var/docs/.nav.yml
    - awesome-nav
    - search
