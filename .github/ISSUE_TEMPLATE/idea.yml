name: Idea
description: A feature, a native API or a platform that Nativella lacks.
labels: ["enhancement"]
body:
    - type: textarea
      attributes:
          label: What for
          description: What your application needs to do, and what stops it today.
      validations:
          required: true
    - type: textarea
      attributes:
          label: How
          description: What it could look like from PHP, if you have an idea.
