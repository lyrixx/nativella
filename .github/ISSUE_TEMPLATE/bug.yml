name: Bug
description: Something does not work as the documentation says.
labels: ["bug"]
body:
    - type: textarea
      attributes:
          label: What happens
          description: What you did, what you expected, and what you got instead, with the output or a screenshot. The smallest project that shows it helps most.
      validations:
          required: true
    - type: input
      attributes:
          label: Versions
          description: "`nativella --version`, and the version of the PHP package."
      validations:
          required: true
    - type: input
      attributes:
          label: Platform
          description: "The system, its version and its architecture: Ubuntu 26.04 x86_64, macOS 26 arm64, Android 16…"
      validations:
          required: true
