name: Release

# Builds the nativella command and the standalone executables of the demos,
# linked against a static PHP, for Linux x86_64, in the static image (Ubuntu
# 22.04, for its glibc), and for macOS arm64; attaches them to the GitHub
# release of a v* tag.

"on":
    push:
        tags: ["v*"]
    workflow_dispatch:

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read
    packages: read

env:
    # Fix for symfony/color detection. We know GitHub Actions can handle it
    ANSICON: 1
    CASTOR_CONTEXT: ci
    # The images build from the cache that .github/workflows/cache.yml pushes
    REGISTRY: "ghcr.io/lyrixx/nativella"

jobs:
    linux:
        name: Build for Linux x86_64
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Log in to registry
              shell: bash
              run: echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: setup-castor
              uses: castor-php/setup-castor@2a495b8c91f00be6768ad8a040ba8634c797d386 # v1.1.0

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false

            - name: "Cache static PHP"
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: static-php/buildroot
                  key: static-php-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.castor/static-php.php') }}

            # The cargo registry and the target directory of the static image
            # (see its CARGO_HOME and CARGO_TARGET_DIR)
            - name: "Cache the Rust build"
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      .home/.cargo/git
                      .home/.cargo/registry
                      target/docker-static
                  key: cargo-static-${{ hashFiles('Cargo.lock', 'infrastructure/docker/services/php/Dockerfile') }}
                  restore-keys: cargo-static-

            # The builder installs and stages the projects
            - name: "Build the builder"
              run: "castor docker:build --service=builder"

            # Builds the static image first. static-php-cli asks the GitHub API
            # for its downloads: without a token, the runners share its rate
            # limit
            - name: "Build PHP as a static library"
              run: "castor static-php:build"
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # Staging copies the .env of a Laravel demo, which castor install
            # creates (with its key)
            - name: "Install the projects"
              run: "castor install"

            - name: "Build the executables"
              run: "castor nativella:build"

            # And checks that they run on the glibc of Ubuntu 22.04
            - name: "Name the executables after the platform"
              run: "castor nativella:package"

            - name: "Upload the executables"
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: nativella-linux-x86_64
                  path: release/
                  if-no-files-found: error

    macos:
        name: Build for macOS arm64
        runs-on: macos-latest
        timeout-minutes: 90
        env:
            # No Docker on macOS runners: the tasks run on the runner itself
            CASTOR_CONTEXT: host
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false

            - name: setup-castor
              uses: castor-php/setup-castor@2a495b8c91f00be6768ad8a040ba8634c797d386 # v1.1.0

            # Composer and PHP stage the demos for production
            - name: "Set up PHP"
              uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: "8.5"
                  extensions: intl, pdo_sqlite, sqlite3
                  tools: composer

            - name: "Cache static PHP"
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: static-php/buildroot
                  key: static-php-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.castor/static-php.php') }}

            # static-php-cli asks the GitHub API for its downloads: without a
            # token, the runners share its rate limit
            - name: "Build PHP as a static library"
              run: "castor static-php:build"
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: "Build the executables"
              run: "castor nativella:build"

            - name: "Name the executables after the platform"
              run: "castor nativella:package"

            - name: "Upload the executables"
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: nativella-macos-aarch64
                  path: release/
                  if-no-files-found: error

    publish:
        name: Publish the release
        if: github.ref_type == 'tag'
        needs: [linux, macos]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: "Download the executables"
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  pattern: nativella-*
                  merge-multiple: true
                  path: release/

            - name: "Create the release, or update its files"
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -e

                  cat > "${RUNNER_TEMP}/notes.md" <<'EOF'
                  `nativella-<platform>` runs a PHP project (`nativella run <project-dir>`)
                  and builds standalone applications (`nativella build`);
                  `nativella-demo-*-<platform>` are the demos, as standalone applications.
                  `SHA256SUMS-<platform>` holds their checksums.

                  They are linked against a static PHP 8.5: they need no PHP on the machine.

                  Linux x86_64: Ubuntu 22.04 or later, Debian 12 or later (glibc 2.35).
                  They need the webview of the system, WebKitGTK 4.1:
                  `sudo apt install libwebkit2gtk-4.1-0`. An application with a tray icon
                  needs `libayatana-appindicator3-1` too, which Ubuntu desktops have.

                  macOS arm64: they need nothing installed. They are not signed: downloaded
                  with a browser, remove the quarantine first, with
                  `xattr -d com.apple.quarantine <file>`.
                  EOF

                  if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
                      gh release upload "${GITHUB_REF_NAME}" release/* --repo "${GITHUB_REPOSITORY}" --clobber
                  else
                      gh release create "${GITHUB_REF_NAME}" release/* --repo "${GITHUB_REPOSITORY}" \
                          --title "${GITHUB_REF_NAME}" --notes-file "${RUNNER_TEMP}/notes.md" --verify-tag
                  fi
