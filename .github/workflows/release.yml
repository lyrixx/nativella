name: Release

# Builds the nativella command and the standalone executables of the demos for
# Linux x86_64, in the builder image; attaches them to the GitHub release of a
# v* tag.

"on":
    push:
        tags: ["v*"]
    workflow_dispatch:

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read
    packages: read

env:
    # Fix for symfony/color detection. We know GitHub Actions can handle it
    ANSICON: 1
    CASTOR_CONTEXT: ci
    # The images build from the cache that .github/workflows/cache.yml pushes
    REGISTRY: "ghcr.io/lyrixx/nativella"

jobs:
    build:
        name: Build for Linux x86_64
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Log in to registry
              shell: bash
              run: echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: setup-castor
              uses: castor-php/setup-castor@2a495b8c91f00be6768ad8a040ba8634c797d386 # v1.1.0

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false

            # The cargo registry and the target directory of the builder (see
            # its CARGO_HOME and CARGO_TARGET_DIR)
            - name: "Cache the Rust build"
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      .home/.cargo/git
                      .home/.cargo/registry
                      target/docker
                  key: cargo-release-${{ hashFiles('Cargo.lock', 'infrastructure/docker/services/php/Dockerfile') }}
                  restore-keys: cargo-release-

            - name: "Build the builder"
              run: "castor docker:build --service=builder"

            # Staging copies the .env of a Laravel demo, which castor install
            # creates (with its key)
            - name: "Install the projects"
              run: "castor install"

            - name: "Build the executables"
              run: "castor nativella:build"

            - name: "Name the executables after the platform"
              shell: bash
              run: |
                  set -e

                  mkdir release
                  cp dist/nativella release/nativella-linux-x86_64
                  for file in dist/*; do
                      name="$(basename "${file}")"
                      if [ "${name}" != nativella ]; then
                          cp "${file}" "release/nativella-demo-${name}-linux-x86_64"
                      fi
                  done
                  (cd release && sha256sum -- * > SHA256SUMS)
                  ls -l release

            - name: "Upload the executables"
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: nativella-linux-x86_64
                  path: release/
                  if-no-files-found: error

    publish:
        name: Publish the release
        if: github.ref_type == 'tag'
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: "Download the executables"
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: nativella-linux-x86_64
                  path: release/

            - name: "Create the release, or update its files"
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -e

                  cat > "${RUNNER_TEMP}/notes.md" <<'EOF'
                  Linux x86_64 executables: `nativella-linux-x86_64` runs a PHP project
                  (`nativella run <project-dir>`) and builds standalone applications
                  (`nativella build`); `nativella-demo-*-linux-x86_64` are the demos, as
                  standalone applications.

                  They are built on Debian 13 and link dynamically against the PHP
                  library (libphp 8.5, embed SAPI), WebKitGTK 4.1 and the libraries Tauri
                  uses on Linux, which must be installed on the system (on Ubuntu:
                  `libphp8.5-embed`, `libwebkit2gtk-4.1-0`, `libxdo3`, `librsvg2-2`,
                  `libayatana-appindicator3-1` for the tray, with
                  the PHP extensions the application needs, e.g. `php8.5-sqlite3`).
                  Embedding a static PHP, for executables without system dependencies,
                  is future work.
                  EOF

                  if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
                      gh release upload "${GITHUB_REF_NAME}" release/* --repo "${GITHUB_REPOSITORY}" --clobber
                  else
                      gh release create "${GITHUB_REF_NAME}" release/* --repo "${GITHUB_REPOSITORY}" \
                          --title "${GITHUB_REF_NAME}" --notes-file "${RUNNER_TEMP}/notes.md" --verify-tag
                  fi
