name: macOS

# Checks the Rust crates on macOS (arm64), against a static PHP, and serves
# each demo through the runtime, without a window.
#
# A pull request runs it on the changes that can break it: the crates,
# mobile/php/php, which describes the static PHP to ext-php-rs, and the
# Castor tasks, which every task goes through. Not on the projects: their PHP
# is the same on every platform, and the smoke tests of the Linux workflows
# catch a change of the protocol with the runtime. Not on the Docker stack:
# there is none on the macOS runners. Weekly too: the runners update their
# Rust stable.
#
# Its caches, the static PHP and the build of the dependencies, are the ones
# of main: main saves them, a pull request and the release restore them (see
# docs/development.md#caches).

"on":
    # Every push to main, whatever the paths: main catches a path missing
    # below, and pull requests that break only together, before a release is
    # tagged from it. And it saves the caches every pull request restores,
    # which GitHub evicts after 7 days unused
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
        paths:
            - ".castor/**"
            - ".github/actions/castor/**"
            - ".github/workflows/macos.yml"
            - "Cargo.lock"
            - "Cargo.toml"
            - "castor.php"
            - "crates/**"
            - "mobile/php/php"
            - "!**.md"
    schedule:
        - cron: "0 0 * * MON"
    workflow_dispatch:

concurrency:
    group: macos-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    # Fix for symfony/color detection. We know GitHub Actions can handle it
    ANSICON: 1
    # As in rust.yml: no incremental compilation, no debug info
    CARGO_INCREMENTAL: 0
    CARGO_PROFILE_DEV_DEBUG: 0

jobs:
    macos:
        name: macOS
        runs-on: macos-26
        timeout-minutes: 90
        permissions:
            # Deletes the caches of main that a new one replaces
            actions: write
            contents: read
        env:
            # No Docker on macOS runners: the tasks run on the runner itself
            CASTOR_CONTEXT: host
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false

            - name: "Set up Castor"
              uses: ./.github/actions/castor

            # Composer and the PHP of the projects, for castor install: the
            # crates link the static PHP below
            - name: "Set up PHP"
              uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: "8.5"
                  extensions: intl, pdo_sqlite, sqlite3
                  # The Composer of the builder: keep in sync with the
                  # Dockerfile of infrastructure/docker/services/php/
                  tools: composer:2.10.3@sha256:7a2d379d5b8ffdaa028580ef26494c36d2feef4b178d3dd1473a4dbc5e17c8d6

            # Built once, then as long as the version of PHP, its extensions,
            # static-php-cli and the libraries it links stay the same: the key
            # of a build is the hash of its stamp, known once built, so the
            # latest one is restored. release.yml restores it too: keep the
            # path and the key in sync
            - name: "Restore static PHP"
              id: static-php
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: static-php/buildroot
                  key: static-php-${{ runner.os }}-${{ runner.arch }}-latest
                  restore-keys: static-php-${{ runner.os }}-${{ runner.arch }}-

            - name: "Read the stamp of the PHP restored"
              id: restored-php
              shell: bash
              run: echo "stamp=${{ hashFiles('static-php/buildroot/.nativella-build') }}" >> "${GITHUB_OUTPUT}"

            # The Rust of the runner, which its image updates
            - name: "Read the version of Rust"
              id: rust
              run: echo "version=$(rustc --version | cut -d ' ' -f 2)" >> "${GITHUB_OUTPUT}"

            # Keyed on the Rust of the runner, then on Cargo.lock, as rust.yml
            # on the image
            - name: "Restore the Rust build"
              id: cargo
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.cargo/git
                      ~/.cargo/registry
                      target/static
                  key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}
                  restore-keys: |
                      cargo-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.version }}-
                      ${{ github.ref != 'refs/heads/main' && format('cargo-{0}-{1}-', runner.os, runner.arch) || '' }}

            # static-php-cli asks the GitHub API for its downloads: without a
            # token, the runners share its rate limit. On main, it downloads
            # the libraries again, and builds again if one has a new release
            - name: "Build PHP as a static library"
              run: "castor static-php:build${{ github.ref == 'refs/heads/main' && ' --update-libraries' || '' }}"
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # Main only, as soon as built again, whatever fails next
            - name: "Save static PHP"
              id: save-static-php
              if: github.ref == 'refs/heads/main' && hashFiles('static-php/buildroot/.nativella-build') != steps.restored-php.outputs.stamp
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: static-php/buildroot
                  key: static-php-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('static-php/buildroot/.nativella-build') }}

            - name: "Delete the static PHP it replaces"
              if: steps.save-static-php.outcome == 'success'
              uses: ./.github/actions/delete-replaced-caches
              with:
                  key: static-php-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('static-php/buildroot/.nativella-build') }}
                  prefix: static-php-${{ runner.os }}-${{ runner.arch }}-

            # The smoke tests serve the demos, with their vendor/
            - name: "Install the projects"
              run: "castor install"

            - name: "Check the Rust crates (fmt, Clippy, tests)"
              run: "castor qa:rust --static"

            - name: "Smoke test the demos through the runtime"
              run: "castor nativella:smoke --static"

            # Main only, once all built, as in rust.yml
            - name: "Prune the Rust build"
              if: github.ref == 'refs/heads/main' && steps.cargo.outputs.cache-hit != 'true'
              run: "castor nativella:prune-target"

            - name: "Save the Rust build"
              id: save-cargo
              if: github.ref == 'refs/heads/main' && steps.cargo.outputs.cache-hit != 'true'
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.cargo/git
                      ~/.cargo/registry
                      target/static
                  key: ${{ steps.cargo.outputs.cache-primary-key }}

            - name: "Delete the Rust builds it replaces"
              if: steps.save-cargo.outcome == 'success'
              uses: ./.github/actions/delete-replaced-caches
              with:
                  key: ${{ steps.cargo.outputs.cache-primary-key }}
                  prefix: cargo-${{ runner.os }}-${{ runner.arch }}-
