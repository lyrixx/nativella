name: PHP

# Builds and starts the stack, then checks the PHP of the projects and of the
# Castor tasks: the security audit, the coding standards, PHPStan, the test
# suites, and the website and the demos through the frontend.
#
# A pull request runs it on the changes that can break it: the projects, their
# tools, the configurations of the checks (.gitignore too: PHP CS Fixer leaves
# out what Git ignores), and the Castor tasks and the Docker stack, which
# every task goes through. Not on the crates: the frontend serves the demos
# without the runtime. Not on the documentation alone, Markdown but the
# fixtures of the tests, and what builds it, nor on the files of the crates
# it links to: the Website workflow builds it, and fails on a broken link.
# Weekly too, for the new advisories of the security audit, and the new
# releases of the PHP and the Rust that the builds pin.

"on":
    # Every push to main, whatever the paths: main catches a path missing
    # below, and pull requests that break only together, before a release is
    # tagged from it
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
        paths:
            - ".castor/**"
            - ".github/actions/castor/**"
            - ".github/actions/stack/**"
            - ".github/workflows/php.yml"
            - ".gitignore"
            - ".php-cs-fixer.php"
            - ".twig-cs-fixer.php"
            - "castor.php"
            - "demos/**"
            - "infrastructure/docker/**"
            - "packages/**"
            - "phpstan.neon"
            - "tools/**"
            - "website/**"
            - "!**.md"
            - "!tools/zensical/**"
            - "!website/docs-theme/**"
            - "!website/zensical.yml"
            - "demos/*/tests/**"
            - "packages/*/tests/**"
    schedule:
        - cron: "0 0 * * MON"
    workflow_dispatch:

concurrency:
    group: php-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    packages: read

env:
    # Fix for symfony/color detection. We know GitHub Actions can handle it
    ANSICON: 1
    CASTOR_CONTEXT: ci
    # The images build from the cache that .github/workflows/cache.yml pushes
    REGISTRY: "ghcr.io/lyrixx/nativella"

jobs:
    php:
        name: PHP
        runs-on: ubuntu-26.04
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false

            - name: "Set up the Docker stack"
              uses: ./.github/actions/stack

            # Builds the images, installs every project, builds the website,
            # migrates the demos and starts the frontend
            - name: "Build and start the infrastructure"
              id: start
              run: "castor start"

            # Each check below runs once the stack is up, whatever the ones
            # before it gave: a new advisory must not hide the rest
            - name: "Check Security issues"
              if: ${{ !cancelled() && steps.start.outcome == 'success' }}
              run: "castor qa:security-audit"

            # Weekly only: a new release of PHP, of Rust or of SQLite is no
            # fault of a pull request
            - name: "Check that the pinned PHP, Rust and SQLite are the latest"
              if: ${{ !cancelled() && github.event_name == 'schedule' }}
              run: "castor qa:outdated"

            - name: "Check PHP coding standards"
              if: ${{ !cancelled() && steps.start.outcome == 'success' }}
              run: "castor qa:cs --dry-run"

            - name: "Check Twig coding standards"
              if: ${{ !cancelled() && steps.start.outcome == 'success' }}
              run: "castor qa:twig-cs --dry-run"

            - name: "Run PHPStan"
              if: ${{ !cancelled() && steps.start.outcome == 'success' }}
              run: "castor qa:phpstan"

            - name: "Run PHPUnit"
              if: ${{ !cancelled() && steps.start.outcome == 'success' }}
              run: "castor qa:phpunit"

            # The packages allow older versions of their dependencies than
            # the demos install
            - name: "Run PHPUnit on the packages, with their lowest dependencies"
              if: ${{ !cancelled() && steps.start.outcome == 'success' }}
              run: "castor qa:phpunit-lowest"

            # The website on the root domain and www, each demo on its own
            # subdomain: the demos run without the native features there
            - name: "Test the frontend"
              if: ${{ !cancelled() && steps.start.outcome == 'success' }}
              run: "castor qa:frontend"
