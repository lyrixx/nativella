name: Static PHP

# Links the crates against a static PHP on Linux, as the release does: serves
# each demo through the runtime; on main, weekly and by hand, builds and
# checks the executables of the demos too, staged for production.
#
# A pull request runs it on the changes of the Rust workflow: a demo can need
# an extension that the static PHP lacks. And on mobile/php/php, which
# describes the static PHP to ext-php-rs. Weekly too. The static image has
# the Rust its Dockerfile pins, as the builder.
#
# A pull request does not build the executables (3 minutes): main builds
# them once merged, as the release does, and the smoke test links the
# runtime against the static PHP already. Only main then catches what only
# they break: an executable that needs a glibc or a libstdc++ newer than the
# ones of Ubuntu 22.04, the release build of the nativella command, linked
# against the static PHP and WebKitGTK, a demo that fails to stage for
# production (mobile.yml stages the Symfony one), or a crate of the desktop
# under a license that tools/cargo-about/about.toml lacks. Run by hand on the
# branch of a pull request, it builds them before the merge.
#
# Its caches, the static PHP and the build of the dependencies, are the ones
# of main: main saves them, a pull request and the release restore them (see
# docs/development.md#caches).

"on":
    # Every push to main, whatever the paths: main catches a path missing
    # below, and pull requests that break only together, before a release is
    # tagged from it. And it saves the caches every pull request restores,
    # which GitHub evicts after 7 days unused
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
        paths:
            - ".castor/**"
            - ".github/actions/castor/**"
            - ".github/actions/stack/**"
            - ".github/workflows/static.yml"
            - "Cargo.lock"
            - "Cargo.toml"
            - "castor.php"
            - "crates/**"
            - "demos/**"
            - "infrastructure/docker/**"
            - "mobile/php/php"
            - "packages/**"
            - "!**.md"
            - "!demos/*/tests/**"
            - "!packages/*/tests/**"
    schedule:
        - cron: "0 0 * * MON"
    workflow_dispatch:

concurrency:
    group: static-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    packages: read

env:
    # Fix for symfony/color detection. We know GitHub Actions can handle it
    ANSICON: 1
    # As in rust.yml: no incremental compilation, no debug info
    CARGO_INCREMENTAL: 0
    CARGO_PROFILE_DEV_DEBUG: 0
    CASTOR_CONTEXT: ci
    # The images build from the cache that .github/workflows/cache.yml pushes
    REGISTRY: "ghcr.io/lyrixx/nativella"

jobs:
    # What the release publishes for Linux: built on Ubuntu 22.04, in the
    # static image, against a static PHP, for the glibc of Ubuntu 22.04
    linux-static:
        name: Linux, static PHP
        runs-on: ubuntu-26.04
        timeout-minutes: 90
        permissions:
            # Deletes the caches of main that a new one replaces
            actions: write
            contents: read
            packages: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false

            - name: "Set up the Docker stack"
              uses: ./.github/actions/stack

            # Built once, then as long as the version of PHP, its extensions,
            # static-php-cli and the glibc stay the same. release.yml restores
            # it too: keep the path and the key in sync
            - name: "Restore static PHP"
              id: static-php
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: static-php/buildroot
                  key: static-php-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.castor/static-php.php') }}
                  # An older one too: static-php:build builds again only if the
                  # versions or the extensions changed, not the rest of the file
                  restore-keys: static-php-${{ runner.os }}-${{ runner.arch }}-

            # The builder installs and stages the projects
            - name: "Build the builder"
              run: "castor docker:build --service=builder"

            - name: "Build the static image"
              run: "castor docker:build --service=static"

            # The Rust of the static image, as in rust.yml
            - name: "Read the version of Rust"
              id: rust
              shell: bash
              run: |
                  version="$(castor builder --service=static -- rustc --version | cut -d ' ' -f 2)"
                  echo "version=${version}" >> "${GITHUB_OUTPUT}"

            # The cargo registry and the target directory of the static image
            # (see its CARGO_HOME and CARGO_TARGET_DIR), keyed as in rust.yml.
            # release.yml restores it too: keep the paths and the key in sync
            - name: "Restore the Rust build"
              id: cargo
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      .home/.cargo/git
                      .home/.cargo/registry
                      target/docker-static
                  key: cargo-static-${{ steps.rust.outputs.version }}-${{ hashFiles('infrastructure/docker/services/php/Dockerfile') }}-${{ hashFiles('Cargo.lock') }}
                  restore-keys: |
                      cargo-static-${{ steps.rust.outputs.version }}-${{ hashFiles('infrastructure/docker/services/php/Dockerfile') }}-
                      ${{ github.ref != 'refs/heads/main' && 'cargo-static-' || '' }}

            # static-php-cli asks the GitHub API for its downloads: without a
            # token, the runners share its rate limit
            - name: "Build PHP as a static library"
              run: "castor static-php:build"
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # Main only, as soon as built, whatever fails next: the key stays
            # until .castor/static-php.php changes, with what it holds
            - name: "Save static PHP"
              id: save-static-php
              if: github.ref == 'refs/heads/main' && steps.static-php.outputs.cache-hit != 'true'
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: static-php/buildroot
                  key: ${{ steps.static-php.outputs.cache-primary-key }}

            - name: "Delete the static PHP it replaces"
              if: steps.save-static-php.outcome == 'success'
              uses: ./.github/actions/delete-replaced-caches
              with:
                  key: ${{ steps.static-php.outputs.cache-primary-key }}
                  prefix: static-php-${{ runner.os }}-${{ runner.arch }}-

            # The smoke tests serve the demos, with their vendor/
            - name: "Install the projects"
              run: "castor install"

            - name: "Smoke test the demos through the runtime"
              run: "castor nativella:smoke --static"

            # Not on a pull request (see the top)
            - name: "Build the executables"
              if: github.event_name != 'pull_request'
              run: "castor nativella:build"

            # Main only, once all built, as in rust.yml
            - name: "Prune the Rust build"
              if: github.ref == 'refs/heads/main' && steps.cargo.outputs.cache-hit != 'true'
              run: "castor nativella:prune-target"

            - name: "Save the Rust build"
              id: save-cargo
              if: github.ref == 'refs/heads/main' && steps.cargo.outputs.cache-hit != 'true'
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      .home/.cargo/git
                      .home/.cargo/registry
                      target/docker-static
                  key: ${{ steps.cargo.outputs.cache-primary-key }}

            - name: "Delete the Rust builds it replaces"
              if: steps.save-cargo.outcome == 'success'
              uses: ./.github/actions/delete-replaced-caches
              with:
                  key: ${{ steps.cargo.outputs.cache-primary-key }}
                  prefix: cargo-static-

            # Fails if an executable needs a glibc, or a libstdc++, newer than
            # the one of Ubuntu 22.04. Not on a pull request, which builds none
            - name: "Check the executables as the release does"
              if: github.event_name != 'pull_request'
              run: "castor nativella:package"
