name: Rust

# Checks the Rust crates in the builder (fmt, Clippy, tests), against its
# libphp, and serves each demo through the runtime, without a window.
#
# A pull request runs it on the changes that can break it: the crates; the
# projects, which the smoke tests serve through the runtime, but not their
# tests, which they do not load; and the Castor tasks and the Docker stack,
# which every task goes through. Not on the documentation alone. Weekly too.
# The builder has the Rust its Dockerfile pins (RUST_VERSION).
#
# Its cache, the cargo registry and the build of the dependencies, is the one
# of main: main saves it, a pull request restores it (see
# docs/development.md#caches).

"on":
    # Every push to main, whatever the paths: main catches a path missing
    # below, and pull requests that break only together, before a release is
    # tagged from it. And it saves the cache every pull request restores,
    # which GitHub evicts after 7 days unused
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
        paths:
            - ".castor/**"
            - ".github/actions/castor/**"
            - ".github/actions/stack/**"
            - ".github/workflows/rust.yml"
            - "Cargo.lock"
            - "Cargo.toml"
            - "castor.php"
            - "crates/**"
            - "demos/**"
            - "infrastructure/docker/**"
            - "packages/**"
            - "!**.md"
            - "!demos/*/tests/**"
            - "!packages/*/tests/**"
    schedule:
        - cron: "0 0 * * MON"
    workflow_dispatch:

concurrency:
    group: rust-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    packages: read

env:
    # Fix for symfony/color detection. We know GitHub Actions can handle it
    ANSICON: 1
    # No incremental compilation, no debug info: of no use to a build from a
    # fresh checkout, they would make most of its cache. docker-compose.yml
    # passes them to the containers. Keep in sync with static.yml, macos.yml
    # and mobile.yml
    CARGO_INCREMENTAL: 0
    CARGO_PROFILE_DEV_DEBUG: 0
    CASTOR_CONTEXT: ci
    # The images build from the cache that .github/workflows/cache.yml pushes
    REGISTRY: "ghcr.io/lyrixx/nativella"

jobs:
    rust:
        name: Rust
        runs-on: ubuntu-26.04
        timeout-minutes: 60
        permissions:
            # Deletes the caches of main that a new one replaces
            actions: write
            contents: read
            packages: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false

            - name: "Set up the Docker stack"
              uses: ./.github/actions/stack

            # The version of the workspace, in every file that repeats it
            - name: "Check the versions"
              run: "castor qa:versions"

            - name: "Build the builder"
              run: "castor docker:build --service=builder"

            # The Rust of the image, which moves with RUST_VERSION in its Dockerfile
            - name: "Read the version of Rust"
              id: rust
              shell: bash
              run: |
                  version="$(castor builder -- rustc --version | cut -d ' ' -f 2)"
                  echo "version=${version}" >> "${GITHUB_OUTPUT}"

            # The cargo registry and the target directory of the builder (see
            # its CARGO_HOME and CARGO_TARGET_DIR), keyed on its Rust and its
            # image, then on Cargo.lock. Else the latest of main for the same
            # Rust and image; for a pull request, for any. Main starts afresh
            # on a new image: the build of another Rust is of no use, and
            # would stay in its cache for good. The iOS job of mobile.yml
            # restores it too: keep the paths and the key in sync
            - name: "Restore the Rust build"
              id: cargo
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      .home/.cargo/git
                      .home/.cargo/registry
                      target/docker
                  key: cargo-debug-${{ steps.rust.outputs.version }}-${{ hashFiles('infrastructure/docker/services/php/Dockerfile') }}-${{ hashFiles('Cargo.lock') }}
                  restore-keys: |
                      cargo-debug-${{ steps.rust.outputs.version }}-${{ hashFiles('infrastructure/docker/services/php/Dockerfile') }}-
                      ${{ github.ref != 'refs/heads/main' && 'cargo-debug-' || '' }}

            # The smoke tests serve the demos, with their vendor/
            - name: "Install the projects"
              run: "castor install"

            - name: "Check the Rust crates (fmt, Clippy, tests)"
              run: "castor qa:rust"

            - name: "Smoke test the demos through the runtime"
              run: "castor nativella:smoke"

            # Main only, once all built: the key stays until the image or
            # Cargo.lock change, with what it holds. Without the crates of the
            # workspace, which a checkout makes cargo build again anyway
            - name: "Prune the Rust build"
              if: github.ref == 'refs/heads/main' && steps.cargo.outputs.cache-hit != 'true'
              run: "castor nativella:prune-target"

            - name: "Save the Rust build"
              id: save-cargo
              if: github.ref == 'refs/heads/main' && steps.cargo.outputs.cache-hit != 'true'
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      .home/.cargo/git
                      .home/.cargo/registry
                      target/docker
                  key: ${{ steps.cargo.outputs.cache-primary-key }}

            - name: "Delete the Rust builds it replaces"
              if: steps.save-cargo.outcome == 'success'
              uses: ./.github/actions/delete-replaced-caches
              with:
                  key: ${{ steps.cargo.outputs.cache-primary-key }}
                  prefix: cargo-debug-
