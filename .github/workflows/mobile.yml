name: Mobile

# Builds the template APK (arm64) in the android image, makes the APK of the
# Symfony demo of it with nativella android, and opens it in an emulator;
# builds the demo for the iOS simulator on a macOS runner, and opens it there,
# experimentally. Both fail if PHP answers no page: their screenshot and the
# output of the app are artifacts. The two platforms build side by side: iOS
# waits only for the bundle of the demo.

"on":
    # Every push to main, whatever the paths: main catches a path missing
    # below, and pull requests that break only together, before a release is
    # tagged from it. And its caches are the ones every pull request restores,
    # which GitHub evicts after 7 days unused
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
        paths:
            - ".castor/**"
            - ".github/workflows/mobile.yml"
            - "Cargo.lock"
            - "Cargo.toml"
            - "castor.php"
            - "crates/**"
            - "demos/symfony/**"
            - "infrastructure/docker/**"
            - "mobile/**"
            - "packages/**"
            - "!**.md"
    workflow_dispatch:

concurrency:
    group: mobile-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    packages: read

env:
    # Fix for symfony/color detection. We know GitHub Actions can handle it
    ANSICON: 1
    CASTOR_CONTEXT: ci
    # The images build from the cache that .github/workflows/cache.yml pushes
    REGISTRY: "ghcr.io/lyrixx/nativella"

jobs:
    android:
        name: Android APK of the Symfony demo
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Log in to registry
              shell: bash
              run: echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: setup-castor
              uses: castor-php/setup-castor@2a495b8c91f00be6768ad8a040ba8634c797d386 # v1.1.0

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false

            # The cargo registry and Gradle live in the home of the containers
            # (.home/), the build in the target directory of the builder
            - name: "Cache the Rust, Gradle and PHP downloads and builds"
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      .home/.cargo/git
                      .home/.cargo/registry
                      .home/.gradle/caches
                      .home/.gradle/wrapper
                      mobile/php/dist
                      target/docker
                  key: android-${{ hashFiles('Cargo.lock', 'infrastructure/docker/services/php/Dockerfile', '.castor/mobile.php') }}
                  restore-keys: android-

            # Stages and bundles the demo in the builder
            - name: "Build the builder"
              run: "castor docker:build --service=builder"

            # Builds the android image, then the template APK, then the APK of
            # the demo from it
            - name: "Build the APK"
              run: "castor mobile:android symfony"

            - name: "Upload the APK"
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: nativella-demo-symfony-android-arm64-debug
                  path: target/nativella/android/symfony.apk
                  if-no-files-found: error
                  retention-days: 1 # Only carries the APK to the emulator job

    # For the iOS job: a bundle is the same on every platform, and the macOS
    # runners have no Docker to make it. The Android job makes its own, rather
    # than wait for this one.
    bundle:
        name: Bundle of the Symfony demo
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Log in to registry
              shell: bash
              run: echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: setup-castor
              uses: castor-php/setup-castor@2a495b8c91f00be6768ad8a040ba8634c797d386 # v1.1.0

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false

            # The build of the Rust job of the CI, read only: its dependencies
            # are the ones of the nativella command, which bundles
            - name: "Restore the Rust build"
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      .home/.cargo/git
                      .home/.cargo/registry
                      target/docker
                  key: cargo-debug-${{ hashFiles('Cargo.lock', 'infrastructure/docker/services/php/Dockerfile') }}
                  restore-keys: cargo-debug-

            - name: "Build the builder"
              run: "castor docker:build --service=builder"

            - name: "Bundle the demo"
              run: "castor nativella:bundle symfony"

            - name: "Upload the bundle of the demo"
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: nativella-demo-symfony-bundle
                  path: target/nativella/app.bundle
                  if-no-files-found: error
                  retention-days: 1 # Only carries the bundle to the iOS job

    android-emulator:
        name: Android emulator, with the APK of the Symfony demo
        needs: android
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false

            - name: setup-castor
              uses: castor-php/setup-castor@2a495b8c91f00be6768ad8a040ba8634c797d386 # v1.1.0

            - name: "Download the APK"
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: nativella-demo-symfony-android-arm64-debug
                  path: target/nativella/apk/

            # The emulator needs hardware acceleration
            - name: "Enable KVM"
              run: |
                  echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                  sudo udevadm control --reload-rules
                  sudo udevadm trigger --name-match=kvm

            # An x86_64 Android 16, which runs the arm64 APK through its ARM
            # translation. Fails if PHP answers no page within 2 minutes.
            - name: "Open the APK in an emulator"
              uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
              with:
                  api-level: 36
                  target: google_apis
                  arch: x86_64
                  disable-animations: true
                  script: castor mobile:android-emulator symfony --apk="$(find target/nativella/apk -name '*.apk' | head -n 1)"

            # What the app showed, and wrote, even when PHP did not answer
            - name: "Upload the screenshot and the output of the app"
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: nativella-demo-symfony-android-emulator-screenshot
                  path: |
                      target/nativella/android-emulator.log
                      target/nativella/android-emulator.png
                  if-no-files-found: ignore

    ios:
        name: iOS simulator app of the Symfony demo (experimental)
        needs: bundle
        runs-on: macos-latest
        timeout-minutes: 60
        env:
            # No Docker on macOS runners: the tasks run on the runner itself
            CASTOR_CONTEXT: host
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false

            - name: setup-castor
              uses: castor-php/setup-castor@2a495b8c91f00be6768ad8a040ba8634c797d386 # v1.1.0

            # A few minutes on these runners, while the app builds:
            # mobile:ios-simulator waits for the end of it
            - name: "Boot the simulator, in the background"
              shell: bash
              run: nohup castor mobile:ios-boot > "${RUNNER_TEMP}/ios-boot.log" 2>&1 &

            # cargo tauri ios init installs those it does not find otherwise,
            # with a `brew reinstall` that waits for a yes at the prompt:
            # XcodeGen generates the Xcode project. The runners have CocoaPods
            # already, as a gem: its bottle and Ruby took 2 minutes for nothing
            - name: "Install XcodeGen and libimobiledevice, and CocoaPods if missing"
              run: |
                  brew install libimobiledevice xcodegen
                  command -v pod > /dev/null || brew install cocoapods

            - name: "Add the iOS simulator target of Rust"
              run: "rustup target add aarch64-apple-ios-sim"

            - name: "Install the Tauri command"
              shell: bash
              run: |
                  set -e

                  mkdir -p "${HOME}/.local/bin"
                  curl -sSfL -o "${RUNNER_TEMP}/cargo-tauri.zip" https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v2.12.2/cargo-tauri-aarch64-apple-darwin.zip
                  unzip -o -d "${HOME}/.local/bin" "${RUNNER_TEMP}/cargo-tauri.zip" cargo-tauri
                  echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

            - name: "Cache the Rust and PHP downloads and builds"
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.cargo/git
                      ~/.cargo/registry
                      mobile/php/dist
                      target
                      !target/nativella
                  key: ios-${{ hashFiles('Cargo.lock', '.castor/mobile.php') }}
                  restore-keys: ios-

            # After the cache, which held the bundle of a previous run
            - name: "Download the bundle of the demo"
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: nativella-demo-symfony-bundle
                  path: target/nativella/

            - name: "Build the simulator app"
              run: "castor mobile:ios symfony --bundle=target/nativella/app.bundle"

            - name: "Upload the simulator app"
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: nativella-demo-symfony-ios-simulator-debug
                  path: crates/nativella/gen/apple/build/**/*.app
                  if-no-files-found: error

            # Fails if PHP answers no page within 2 minutes
            - name: "Open the app in a simulator"
              run: "castor mobile:ios-simulator symfony"

            # What the app showed, and wrote, even when it stopped
            - name: "Upload the screenshot and the output of the app"
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: nativella-demo-symfony-ios-simulator-screenshot
                  path: |
                      target/nativella/ios-simulator.log
                      target/nativella/ios-simulator.png
                  if-no-files-found: ignore
