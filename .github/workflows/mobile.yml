name: Mobile

# Builds the Symfony demo for Android (arm64) in the android image, and for the
# iOS simulator on a macOS runner, experimentally.

"on":
    push:
        branches: ["main"]
        paths:
            - ".castor/**"
            - ".github/workflows/mobile.yml"
            - "Cargo.lock"
            - "Cargo.toml"
            - "castor.php"
            - "crates/**"
            - "demos/symfony/**"
            - "infrastructure/docker/**"
            - "mobile/**"
            - "packages/**"
    pull_request:
        branches: ["main"]
        paths:
            - ".castor/**"
            - ".github/workflows/mobile.yml"
            - "Cargo.lock"
            - "Cargo.toml"
            - "castor.php"
            - "crates/**"
            - "demos/symfony/**"
            - "infrastructure/docker/**"
            - "mobile/**"
            - "packages/**"
    workflow_dispatch:

concurrency:
    group: mobile-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    packages: read

env:
    # Fix for symfony/color detection. We know GitHub Actions can handle it
    ANSICON: 1
    CASTOR_CONTEXT: ci
    # The images build from the cache that .github/workflows/cache.yml pushes
    REGISTRY: "ghcr.io/lyrixx/nativella"

jobs:
    android:
        name: Android APK of the Symfony demo
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Log in to registry
              shell: bash
              run: echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: setup-castor
              uses: castor-php/setup-castor@2a495b8c91f00be6768ad8a040ba8634c797d386 # v1.1.0

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false

            # The cargo registry and Gradle live in the home of the containers
            # (.home/), the build in the target directory of the builder
            - name: "Cache the Rust, Gradle and PHP downloads and builds"
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      .home/.cargo/git
                      .home/.cargo/registry
                      .home/.gradle/caches
                      .home/.gradle/wrapper
                      mobile/php/dist
                      target/docker
                  key: android-${{ hashFiles('Cargo.lock', 'infrastructure/docker/services/php/Dockerfile', '.castor/mobile.php') }}
                  restore-keys: android-

            # Stages and bundles the demo in the builder
            - name: "Build the builder"
              run: "castor docker:build --service=builder"

            # Builds the android image first
            - name: "Build the APK"
              run: "castor mobile:android symfony"

            - name: "Upload the APK"
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: nativella-demo-symfony-android-arm64-debug
                  path: crates/nativella/gen/android/app/build/outputs/apk/**/*.apk
                  if-no-files-found: error

            # For the iOS job: a bundle is the same on every platform, and the
            # macOS runner has no Docker to make it
            - name: "Upload the bundle of the demo"
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: nativella-demo-symfony-bundle
                  path: target/nativella/app.bundle
                  if-no-files-found: error

    ios:
        name: iOS simulator app of the Symfony demo (experimental)
        needs: android
        # Until it passes once
        continue-on-error: true
        runs-on: macos-latest
        timeout-minutes: 60
        env:
            # No Docker on macOS runners: the tasks run on the runner itself
            CASTOR_CONTEXT: host
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false

            - name: setup-castor
              uses: castor-php/setup-castor@2a495b8c91f00be6768ad8a040ba8634c797d386 # v1.1.0

            - name: "Download the bundle of the demo"
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: nativella-demo-symfony-bundle
                  path: target/nativella/

            # cargo tauri ios init installs them otherwise, with a `brew
            # reinstall` that waits for a yes at the prompt: XcodeGen generates
            # the Xcode project
            - name: "Install XcodeGen, libimobiledevice and CocoaPods"
              run: "brew install cocoapods libimobiledevice xcodegen"

            - name: "Add the iOS simulator target of Rust"
              run: "rustup target add aarch64-apple-ios-sim"

            - name: "Install the Tauri command"
              shell: bash
              run: |
                  set -e

                  mkdir -p "${HOME}/.local/bin"
                  curl -sSfL -o "${RUNNER_TEMP}/cargo-tauri.zip" https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v2.12.2/cargo-tauri-aarch64-apple-darwin.zip
                  unzip -o -d "${HOME}/.local/bin" "${RUNNER_TEMP}/cargo-tauri.zip" cargo-tauri
                  echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

            - name: "Cache the Rust and PHP downloads and builds"
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.cargo/git
                      ~/.cargo/registry
                      mobile/php/dist
                      target
                  key: ios-${{ hashFiles('Cargo.lock', '.castor/mobile.php') }}
                  restore-keys: ios-

            - name: "Build the simulator app"
              run: "castor mobile:ios symfony --bundle=target/nativella/app.bundle"

            - name: "Upload the simulator app"
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: nativella-demo-symfony-ios-simulator-debug
                  path: crates/nativella/gen/apple/build/**/*.app
                  if-no-files-found: error
