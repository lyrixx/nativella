name: Mobile

# Builds the template APK (arm64) in the android image, makes the APK of the
# Symfony demo of it with nativella android, and opens it in an emulator;
# builds the demo for the iOS simulator on a macOS runner, and opens it there,
# experimentally. Both fail if PHP answers no page: their screenshot and the
# output of the app are artifacts. The two platforms build side by side: iOS
# waits only for the bundle of the demo.
#
# Its caches, the downloads, PHP for the phones and the build of the
# dependencies, are the ones of main: main saves them, a pull request and the
# release restore them (see docs/development.md#caches).

"on":
    # Every push to main, whatever the paths: main catches a path missing
    # below, and pull requests that break only together, before a release is
    # tagged from it. And it saves the caches every pull request restores,
    # which GitHub evicts after 7 days unused
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
        paths:
            - ".castor/**"
            - ".github/workflows/mobile.yml"
            - "Cargo.lock"
            - "Cargo.toml"
            - "castor.php"
            - "crates/**"
            - "demos/symfony/**"
            - "infrastructure/docker/**"
            - "mobile/**"
            - "packages/**"
            - "!**.md"
    workflow_dispatch:

concurrency:
    group: mobile-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    packages: read

env:
    # Fix for symfony/color detection. We know GitHub Actions can handle it
    ANSICON: 1
    # As in rust.yml: no incremental compilation, no debug info, but line
    # tables for the iOS job (see there). The Bundle job restores the build of
    # rust.yml: built with them, it is of use only with them too
    CARGO_INCREMENTAL: 0
    CARGO_PROFILE_DEV_DEBUG: 0
    CASTOR_CONTEXT: ci
    # The images build from the cache that .github/workflows/cache.yml pushes
    REGISTRY: "ghcr.io/lyrixx/nativella"

jobs:
    android:
        name: Android APK of the Symfony demo
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Log in to registry
              shell: bash
              run: echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: setup-castor
              uses: castor-php/setup-castor@2a495b8c91f00be6768ad8a040ba8634c797d386 # v1.1.0

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false

            # PHP for Android, keyed on the image, for its NDK, then on what it
            # is built from: static-php-cli and the extensions, the recipes,
            # the API level of the template. static-php:android builds it again
            # only if one of them changed. release.yml restores it too: keep
            # the path and the key in sync
            - name: "Restore PHP for Android"
              id: static-php
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: static-php/android-arm64/buildroot
                  key: static-php-android-arm64-${{ hashFiles('infrastructure/docker/services/php/Dockerfile') }}-${{ hashFiles('.castor/static-php.php', '.castor/static-php-mobile.php', 'crates/nativella/tauri.android.conf.json') }}
                  restore-keys: |
                      static-php-android-arm64-${{ hashFiles('infrastructure/docker/services/php/Dockerfile') }}-
                      ${{ github.ref != 'refs/heads/main' && 'static-php-android-arm64-' || '' }}

            # The cargo registry and the dependencies of Gradle live in the
            # home of the containers (.home/), the build in the target
            # directory of the builder. Not the distribution of Gradle
            # (.home/.gradle/wrapper/): downloaded as fast as restored. Keyed
            # on the image, for its Rust and its Tauri command, as in rust.yml.
            # release.yml restores it too: keep the paths and the key in sync
            - name: "Restore the Rust and Gradle downloads and builds"
              id: android
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      .home/.cargo/git
                      .home/.cargo/registry
                      .home/.gradle/caches
                      target/docker
                  key: android-${{ hashFiles('infrastructure/docker/services/php/Dockerfile') }}-${{ hashFiles('Cargo.lock', '.castor/mobile.php') }}
                  restore-keys: |
                      android-${{ hashFiles('infrastructure/docker/services/php/Dockerfile') }}-
                      ${{ github.ref != 'refs/heads/main' && 'android-' || '' }}

            # Downloads the sources of PHP, and stages and bundles the demo, in
            # the builder
            - name: "Build the builder"
              run: "castor docker:build --service=builder"

            # Builds the android image first. static-php-cli asks the GitHub
            # API for the sources: without a token, the runners share its rate
            # limit
            - name: "Build PHP for Android"
              run: "castor static-php:android"
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # Main only, as soon as built, whatever fails next, as static.yml
            # saves the static PHP of the desktop
            - name: "Save PHP for Android"
              if: github.ref == 'refs/heads/main' && steps.static-php.outputs.cache-hit != 'true'
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: static-php/android-arm64/buildroot
                  key: ${{ steps.static-php.outputs.cache-primary-key }}

            # The template APK, with the PHP built above, then the APK of the
            # demo from it
            - name: "Build the APK"
              run: "castor mobile:android symfony"

            - name: "Upload the APK"
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: nativella-demo-symfony-android-arm64-debug
                  path: target/nativella/android/symfony.apk
                  if-no-files-found: error
                  retention-days: 1 # Only carries the APK to the emulator job

            # Main only, once all built, as in rust.yml
            - name: "Prune the Rust build"
              if: github.ref == 'refs/heads/main' && steps.android.outputs.cache-hit != 'true'
              run: "castor nativella:prune-target"

            - name: "Save the Rust and Gradle downloads and builds"
              if: github.ref == 'refs/heads/main' && steps.android.outputs.cache-hit != 'true'
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      .home/.cargo/git
                      .home/.cargo/registry
                      .home/.gradle/caches
                      target/docker
                  key: ${{ steps.android.outputs.cache-primary-key }}

    # For the iOS job: a bundle is the same on every platform, and the macOS
    # runners have no Docker to make it. The Android job makes its own, rather
    # than wait for this one.
    bundle:
        name: Bundle of the Symfony demo
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Log in to registry
              shell: bash
              run: echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: setup-castor
              uses: castor-php/setup-castor@2a495b8c91f00be6768ad8a040ba8634c797d386 # v1.1.0

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false

            # The build of rust.yml, read only: its dependencies are the ones
            # of the nativella command, which bundles. Its paths and its key
            # are the ones of rust.yml
            - name: "Restore the Rust build"
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      .home/.cargo/git
                      .home/.cargo/registry
                      target/docker
                  key: cargo-debug-${{ hashFiles('infrastructure/docker/services/php/Dockerfile') }}-${{ hashFiles('Cargo.lock') }}
                  restore-keys: |
                      cargo-debug-${{ hashFiles('infrastructure/docker/services/php/Dockerfile') }}-
                      cargo-debug-

            - name: "Build the builder"
              run: "castor docker:build --service=builder"

            - name: "Bundle the demo"
              run: "castor nativella:bundle symfony"

            - name: "Upload the bundle of the demo"
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: nativella-demo-symfony-bundle
                  path: target/nativella/app.bundle
                  if-no-files-found: error
                  retention-days: 1 # Only carries the bundle to the iOS job

    android-emulator:
        name: Android emulator, with the APK of the Symfony demo
        needs: android
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false

            - name: setup-castor
              uses: castor-php/setup-castor@2a495b8c91f00be6768ad8a040ba8634c797d386 # v1.1.0

            - name: "Download the APK"
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: nativella-demo-symfony-android-arm64-debug
                  path: target/nativella/apk/

            # The emulator needs hardware acceleration
            - name: "Enable KVM"
              run: |
                  echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                  sudo udevadm control --reload-rules
                  sudo udevadm trigger --name-match=kvm

            # An x86_64 Android 16, which runs the arm64 APK through its ARM
            # translation. Fails if PHP answers no page within 2 minutes.
            - name: "Open the APK in an emulator"
              uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
              with:
                  api-level: 36
                  target: google_apis
                  arch: x86_64
                  disable-animations: true
                  script: castor mobile:android-emulator symfony --apk="$(find target/nativella/apk -name '*.apk' | head -n 1)"

            # What the app showed, and wrote, even when PHP did not answer
            - name: "Upload the screenshot and the output of the app"
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: nativella-demo-symfony-android-emulator-screenshot
                  path: |
                      target/nativella/android-emulator.log
                      target/nativella/android-emulator.png
                  if-no-files-found: ignore

    ios:
        name: iOS simulator app of the Symfony demo (experimental)
        needs: bundle
        runs-on: macos-latest
        # PHP for iOS, when it builds again, takes half an hour
        timeout-minutes: 90
        env:
            # Line tables, not no debug info: swift-rs builds the Swift of
            # Tauri in debug only when cargo builds with debug info (its DEBUG
            # variable), and only a debug build of it sends what the app
            # writes to the log of the system, where mobile:ios-simulator reads
            # that PHP answered
            CARGO_PROFILE_DEV_DEBUG: line-tables-only
            # No Docker on macOS runners: the tasks run on the runner itself
            CASTOR_CONTEXT: host
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false

            - name: setup-castor
              uses: castor-php/setup-castor@2a495b8c91f00be6768ad8a040ba8634c797d386 # v1.1.0

            # A few minutes on these runners, while the app builds:
            # mobile:ios-simulator waits for the end of it
            - name: "Boot the simulator, in the background"
              shell: bash
              run: nohup castor mobile:ios-boot > "${RUNNER_TEMP}/ios-boot.log" 2>&1 &

            # cargo tauri ios init installs with brew what it does not find:
            # XcodeGen, which generates the Xcode project, from its release
            # here, pinned, in seconds rather than minutes
            - name: "Install XcodeGen"
              shell: bash
              run: |
                  set -e

                  curl -sSfL -o "${RUNNER_TEMP}/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
                  echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  ${RUNNER_TEMP}/xcodegen.zip" | shasum -a 256 -c -
                  unzip -q -o -d "${RUNNER_TEMP}" "${RUNNER_TEMP}/xcodegen.zip"
                  echo "${RUNNER_TEMP}/xcodegen/bin" >> "${GITHUB_PATH}"

            # And what a simulator build does not use, but cargo tauri ios init
            # looks for: libimobiledevice (idevicesyslog), for the logs of a
            # phone, and CocoaPods (pod), for the pods of an app that has some.
            # Stand-ins, which fail if run, in the place of what is missing
            - name: "Stand in for libimobiledevice and CocoaPods"
              shell: bash
              run: |
                  set -e

                  mkdir -p "${RUNNER_TEMP}/stand-ins"
                  for command in idevicesyslog pod; do
                      if ! command -v "${command}" > /dev/null; then
                          printf '#!/bin/sh\necho "%s: a stand-in of the CI, for cargo tauri ios init." >&2\nexit 1\n' "${command}" > "${RUNNER_TEMP}/stand-ins/${command}"
                          chmod +x "${RUNNER_TEMP}/stand-ins/${command}"
                      fi
                  done
                  echo "${RUNNER_TEMP}/stand-ins" >> "${GITHUB_PATH}"

            - name: "Add the iOS simulator target of Rust"
              run: "rustup target add aarch64-apple-ios-sim"

            - name: "Install the Tauri command"
              shell: bash
              run: |
                  set -e

                  mkdir -p "${HOME}/.local/bin"
                  curl -sSfL -o "${RUNNER_TEMP}/cargo-tauri.zip" https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v2.12.2/cargo-tauri-aarch64-apple-darwin.zip
                  unzip -o -d "${HOME}/.local/bin" "${RUNNER_TEMP}/cargo-tauri.zip" cargo-tauri
                  echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

            # The Rust of the runner, which its image updates
            - name: "Read the version of Rust"
              id: rust
              run: echo "version=$(rustc --version | cut -d ' ' -f 2)" >> "${GITHUB_OUTPUT}"

            # Keyed on the Rust of the runner, then on what builds, as
            # macos.yml. Not target/nativella/, where the bundle of the demo
            # goes
            - name: "Restore the Rust downloads and builds"
              id: ios
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.cargo/git
                      ~/.cargo/registry
                      target/*
                      !target/nativella
                  key: ios-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock', '.castor/mobile.php') }}
                  restore-keys: |
                      ios-${{ steps.rust.outputs.version }}-
                      ${{ github.ref != 'refs/heads/main' && 'ios-' || '' }}

            # The Xcode of the runner, which its image updates: the version
            # and the build
            - name: "Read the version of Xcode"
              id: xcode
              shell: bash
              run: echo "version=$(xcodebuild -version | awk 'NR == 1 { version = $2 } NR == 2 { build = $3 } END { print version "-" build }')" >> "${GITHUB_OUTPUT}"

            # PHP for iOS and its simulator, keyed on the Xcode of the runner,
            # then on what it is built from: static-php-cli and the
            # extensions, the recipes. static-php:ios builds it again only if
            # one of them changed
            - name: "Restore PHP for iOS"
              id: static-php
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      static-php/ios-arm64/buildroot
                      static-php/ios-simulator-arm64/buildroot
                  key: static-php-ios-${{ steps.xcode.outputs.version }}-${{ hashFiles('.castor/static-php.php', '.castor/static-php-mobile.php') }}
                  restore-keys: |
                      static-php-ios-${{ steps.xcode.outputs.version }}-
                      ${{ github.ref != 'refs/heads/main' && 'static-php-ios-' || '' }}

            # For the device too, which nothing runs, but which must build.
            # static-php-cli asks the GitHub API for the sources of PHP:
            # without a token, the runners share its rate limit
            - name: "Build PHP for iOS and its simulator"
              run: "castor static-php:ios"
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # Main only, as soon as built, whatever fails next, as static.yml
            # saves the static PHP of the desktop
            - name: "Save PHP for iOS"
              if: github.ref == 'refs/heads/main' && steps.static-php.outputs.cache-hit != 'true'
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      static-php/ios-arm64/buildroot
                      static-php/ios-simulator-arm64/buildroot
                  key: ${{ steps.static-php.outputs.cache-primary-key }}

            - name: "Download the bundle of the demo"
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: nativella-demo-symfony-bundle
                  path: target/nativella/

            - name: "Build the simulator app"
              run: "castor mobile:ios symfony --bundle=target/nativella/app.bundle"

            # Main only, once built, whatever fails next, as in rust.yml
            - name: "Prune the Rust build"
              if: github.ref == 'refs/heads/main' && steps.ios.outputs.cache-hit != 'true'
              run: "castor nativella:prune-target"

            - name: "Save the Rust downloads and builds"
              if: github.ref == 'refs/heads/main' && steps.ios.outputs.cache-hit != 'true'
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.cargo/git
                      ~/.cargo/registry
                      target/*
                      !target/nativella
                  key: ${{ steps.ios.outputs.cache-primary-key }}

            - name: "Upload the simulator app"
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: nativella-demo-symfony-ios-simulator-debug
                  path: crates/nativella/gen/apple/build/**/*.app
                  if-no-files-found: error

            # Fails if PHP answers no page within 2 minutes
            - name: "Open the app in a simulator"
              run: "castor mobile:ios-simulator symfony"

            # What the app showed, and wrote, even when it stopped
            - name: "Upload the screenshot and the output of the app"
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: nativella-demo-symfony-ios-simulator-screenshot
                  path: |
                      target/nativella/ios-simulator.log
                      target/nativella/ios-simulator.png
                  if-no-files-found: ignore
