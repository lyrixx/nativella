version: 2
updates:
    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'monthly'
      groups:
          github-actions:
              patterns:
                  - '*'
          github-actions-security:
              applies-to: security-updates
              patterns:
                  - '*'
      cooldown:
          default-days: 7

    # Zensical, pinned in tools/zensical/requirements.txt
    - package-ecosystem: 'pip'
      directory: '/tools/zensical'
      schedule:
          interval: 'monthly'
      groups:
          zensical:
              patterns:
                  - '*'
      cooldown:
          default-days: 7
