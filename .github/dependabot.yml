version: 2

# One pull request per ecosystem: a group gathers the updates of the
# dependencies its patterns match, across every directory of the entry, and
# '*' matches them all. Without a group, each dependency gets a pull request of
# its own. The *-security groups do the same for the security updates.
updates:
    # The workspace: crates/nativella and crates/runtime. A new minor version
    # of tauri needs the Tauri command of the same one: the builds of the
    # templates stop until TAURI_CLI_VERSION follows, in .castor/mobile.php
    - package-ecosystem: 'cargo'
      directory: '/'
      schedule:
          interval: 'monthly'
      groups:
          cargo:
              patterns:
                  - '*'
          cargo-security:
              applies-to: security-updates
              patterns:
                  - '*'
      ignore:
          # The jni of tao, wry and tauri, which crates/nativella reads the
          # assets of the APK with (src/embedded.rs): another one would be a
          # second jni in the Android build. Raise this bound when Tauri moves
          # to the next one. Not update-types: to Dependabot, 0.21 to 0.22 is
          # a minor update.
          - dependency-name: 'jni'
            versions:
                - '>= 0.22'
          # The RustCrypto crates of cms and pkcs12, which sign iOS apps and
          # read their certificates: their stable releases, cms 0.2 and
          # pkcs12 0.1, are of the generation of der 0.7, and so must be the
          # crates handed to them or used next to them. Lift these bounds
          # once cms 0.3 and pkcs12 0.2 are released.
          - dependency-name: 'cbc'
            versions:
                - '>= 0.2'
          - dependency-name: 'der'
            versions:
                - '>= 0.8'
          - dependency-name: 'des'
            versions:
                - '>= 0.9'
          - dependency-name: 'hmac'
            versions:
                - '>= 0.13'
          - dependency-name: 'pkcs5'
            versions:
                - '>= 0.8'
          - dependency-name: 'rc2'
            versions:
                - '>= 0.9'
          - dependency-name: 'sha1'
            versions:
                - '>= 0.11'
          - dependency-name: 'x509-cert'
            versions:
                - '>= 0.3'
      cooldown:
          default-days: 7

    # Every project with a composer.json; the directories without one are
    # skipped. Dependabot raises a constraint of an application when it no
    # longer allows the new version, and widens it for a package of type
    # library: a symfony-bundle is an application to it.
    - package-ecosystem: 'composer'
      directories:
          - '/demos/*'
          - '/packages/*'
          - '/tools/*'
          - '/website'
      schedule:
          interval: 'monthly'
      groups:
          composer:
              patterns:
                  - '*'
          composer-security:
              applies-to: security-updates
              patterns:
                  - '*'
      ignore:
          # The packages of this repository, through path repositories
          - dependency-name: 'nativella/*'
          # Symfony 9 would turn the ^7.4|^8.0 of the bundle into ^9.0. Symfony
          # majors are migrated by hand: raise this bound with each one. Not
          # update-types: they need the version of a lock, the bundle has none.
          - dependency-name: 'symfony/*'
            versions:
                - '>=9.0'
      cooldown:
          default-days: 7

    # The images of the Dockerfiles, pinned by their digest: Dependabot
    # updates the digest of a tag too. Merged into main, an update runs
    # cache.yml, which pushes the build cache of the new images. No security
    # group: the GitHub Advisory Database has no Docker ecosystem.
    - package-ecosystem: 'docker'
      directories:
          - '/infrastructure/docker/services/*'
      schedule:
          interval: 'monthly'
      groups:
          docker:
              patterns:
                  - '*'
      ignore:
          # The static service builds on Ubuntu 22.04 for its glibc, 2.35: see
          # the Dockerfile
          - dependency-name: 'ubuntu'
            versions:
                - '> 22.04'
      cooldown:
          default-days: 7

    # The workflows, and the composite actions they share
    - package-ecosystem: 'github-actions'
      directories:
          - '/'
          - '/.github/actions/*'
      schedule:
          interval: 'monthly'
      groups:
          github-actions:
              patterns:
                  - '*'
          github-actions-security:
              applies-to: security-updates
              patterns:
                  - '*'
      cooldown:
          default-days: 7

    # Zensical, pinned in tools/zensical/requirements.txt
    - package-ecosystem: 'pip'
      directory: '/tools/zensical'
      schedule:
          interval: 'monthly'
      groups:
          zensical:
              patterns:
                  - '*'
          zensical-security:
              applies-to: security-updates
              patterns:
                  - '*'
      cooldown:
          default-days: 7
